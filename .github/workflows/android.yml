name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build debug APK
      run: |
        set -o pipefail
        ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log

    - name: Rename APK
      run: |
        mkdir -p out
        cp app/build/outputs/apk/debug/*.apk out/EditorIA-${{ github.run_number }}.apk
        ls -la out

    - name: Upload APK (artifact)
      uses: actions/upload-artifact@v4
      with:
        name: EditorIA-apk
        path: out/*.apk

    - name: Publish APK to Releases (easy download on the phone)
      if: github.event_name != 'pull_request'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Build ${{ github.run_number }}
        body: APK de teste gerado automaticamente. Baixe o arquivo .apk abaixo e instale no celular.
        files: out/*.apk
        prerelease: true

    - name: Publish build log when it fails (so it can be read without the Actions page)
      if: failure()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: log-${{ github.run_number }}
        name: Build log ${{ github.run_number }} (falhou)
        files: build.log
        prerelease: true
